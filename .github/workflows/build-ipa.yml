name: Build Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.42.0"

jobs:
  # ---------------------------------------------------------------------------
  # 单元测试：在 iOS 26 模拟器上跑。失败不阻断打包（首次调试期有用）。
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ModuReader.xcodeproj \
            -scheme ModuReader \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 打包：设备 SDK Release archive → Payload → 未签名 IPA
  # ---------------------------------------------------------------------------
  build:
    name: Build Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Lint Info.plist
        run: |
          plutil -lint ModuReader/Resources/Info.plist

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ModuReader.xcodeproj \
            -scheme ModuReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ModuReader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcbeautify

      - name: Verify archive contents
        run: |
          APP="build/ModuReader.xcarchive/Products/Applications/ModuReader.app"
          test -d "$APP" || { echo "::error::找不到 ModuReader.app"; exit 1; }
          test -f "$APP/ModuReader" || { echo "::error::缺少可执行文件"; exit 1; }
          plutil -p "$APP/Info.plist" | head -40

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/ModuReader.xcarchive/Products/Applications/ModuReader.app"
          rm -rf build/Payload build/ModuReader-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          # -y 保留符号链接：丢失会导致侧载后启动崩溃
          zip -qry ModuReader-unsigned.ipa Payload
          ls -lh ModuReader-unsigned.ipa
          unzip -l ModuReader-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ModuReader-unsigned-ipa
          path: build/ModuReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
