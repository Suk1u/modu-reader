name: ModuReader
options:
  bundleIdPrefix: com.modu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  ModuReader:
    type: application
    platform: iOS
    sources:
      - path: ModuReader
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    info:
      path: ModuReader/Resources/Info.plist
      properties:
        CFBundleDisplayName: 墨读
        CFBundleName: ModuReader
        CFBundleShortVersionString: "0.9.2"
        CFBundleVersion: "16"
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 刻意不声明 UIApplicationSceneManifest。
        #
        # 原因：一旦声明，iOS 走 scene 生命周期，
        # `application(_:open:options:)` 不再被调用；而 SwiftUI 的 onOpenURL
        # 在「从其他 App 分享文件过来」这条路径上也不保证触发，
        # 导致共享面板打开文件完全无响应。
        #
        # 不声明时，系统走传统生命周期，AppDelegate 的 URL 回调必然触发。
        # SwiftUI 的 @main App 在没有 scene manifest 时仍会正常创建窗口。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 刻意设为 false。
        #
        # true 时系统把「共享/用其他应用打开」的文件**原地**打开，
        # 通过安全范围 URL 交给 App，不复制到 Documents/Inbox。
        # 但 iOS 26+ 强制 scene 生命周期后，这条 URL 回调路径实测不触发
        # （application(_:open:options:) 与 onOpenURL 均无日志），
        # 导致共享打开完全无反应。
        #
        # false 时系统把文件**复制**到 Documents/Inbox，
        # 由 InboxScanner 主动扫描 —— 不依赖任何回调，必然有效。
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: false
        ITSAppUsesNonExemptEncryption: false
        # 声明本 App 能打开的文档类型。
        # 没有这一段，系统的「共享 → 用其他应用打开」不会列出本 App，
        # Files App 里点击 .txt 也不会出现本 App。
        CFBundleDocumentTypes:
          - CFBundleTypeName: 纯文本
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.text
              - net.daringfireball.markdown
          - CFBundleTypeName: EPUB 电子书
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: 漫画压缩包
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.modu.comic-archive
        # 自定义 UTI：CBZ / CBR / CB7 系统没有内置类型
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.modu.comic-archive
            UTTypeDescription: 漫画压缩包
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
                - cbr
                - cb7
              public.mime-type:
                - application/vnd.comicbook+zip
                - application/x-cbr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modu.reader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ModuReader/Resources/Info.plist

  ModuReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ModuReaderTests
    dependencies:
      - target: ModuReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modu.reader.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ModuReader:
    build:
      targets:
        ModuReader: all
        ModuReaderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ModuReaderTests
